services:
  postgres:
    image: postgres:16-alpine
    container_name: seatsync_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seatsync_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
